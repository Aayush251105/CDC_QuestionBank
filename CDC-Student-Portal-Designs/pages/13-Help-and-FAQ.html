<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const items = [
      ['Who can use the question bank?', 'Current Shiv Nadar students with an SNU Microsoft account. Sign in with your snu.edu.in account; personal accounts are not accepted.'],
      ['How do I share questions from a test?', 'Choose Submit OA, pick the company drive, add the round details, then type the questions or upload photos of your rough work. Check the cleaned version and send it to the CDC.'],
      ['What happens to the photos I upload?', 'We read the text from them and delete the images straight away. Only the text you confirm is kept.'],
      ['Why is my submission still pending?', 'The CDC reviews submissions in batches during the drive season. You can edit or withdraw it until the review starts.'],
      ['My submission says Not published. Why?', 'The CDC decides what to add, for example when a round already has the same questions. Reasons are not shared, and it does not affect your account.'],
      ['Will other students see my name?', 'Only if you tick Credit me by name. Otherwise your questions appear without a name.'],
      ['My company or drive is not listed.', 'On the first step of Submit OA, choose My drive is not listed and tell us the company and date. The CDC adds it and your draft is kept.']
    ];
    const o = this.state.open;
    return { faq: items.map(([q, a], i) => ({ q, a, isOpen: o === i, open: o === i ? 'true' : 'false', icon: o === i ? '−' : '+', toggle: () => this.setState({ open: o === i ? -1 : i }) })) };
  }
}

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 · Company detail · CDC Student Portal</title>
<script src="support.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#CD1739}a:hover{color:#A51230}
:focus-visible{outline:2px solid #2B2B2B;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.top{background:#2B2B2B;color:#F4E6CD;font-size:13px}
.top a{color:#F4E6CD;text-decoration:none}.top a:hover{color:#FFFFFF;text-decoration:underline}
.hdr{background:#FFFFFF;border-bottom:1px solid #E3E3E3}
.nav a{color:#2B2B2B;text-decoration:none;font-weight:700;font-size:15px;padding:24px 0 22px;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:#CD1739;border-bottom-color:#CD1739}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;background:#CD1739;color:#FFFFFF;border:1px solid #CD1739;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#A51230;border-color:#A51230;color:#FFFFFF}
.nav a.btn{padding:0 22px;border-bottom:1px solid #CD1739;color:#FFFFFF}
.nav a.btn:hover{border-bottom-color:#A51230;color:#FFFFFF}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;background:transparent;color:#2B2B2B;border:1px solid #2B2B2B;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn2:hover{background:#2B2B2B;color:#FFFFFF}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#CD1739}
.crumb{font-size:14px;color:#4A4A49;display:flex;flex-wrap:wrap;gap:8px}
.crumb a{color:#2B2B2B;text-decoration:underline;text-underline-offset:3px}
.tab{min-height:50px;padding:0 2px;margin-right:28px;border:none;border-bottom:3px solid transparent;background:none;font:inherit;font-size:16px;font-weight:700;color:#4A4A49;cursor:pointer}
.tab[aria-selected="true"]{color:#CD1739;border-bottom-color:#CD1739}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F5F5E}
.ftr{background:#2B2B2B;color:#F4E6CD}
.ftr a{color:#FFFFFF;text-decoration:none}.ftr a:hover{text-decoration:underline}
</style>
</helmet>
<div style="font-family: 'DM Sans', sans-serif; color: #2B2B2B; background: #FFFFFF; min-height: 100vh; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column">

  <div class="top"><div class="wrap" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; padding-top: 8px; padding-bottom: 8px"><span>Career Development Centre · Shiv Nadar Institution of Eminence</span><span style="display: flex; gap: 20px"><a href="13-Help-and-FAQ.html">Help</a><a href="10-My-submissions.html">Notifications (1)</a><a href="12-Profile.html">Aarav Sharma</a></span></div></div>
  <header class="hdr"><div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 32px">
    <a href="02-Home.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; text-decoration: none; color: #2B2B2B">
      <span style="display: flex; flex-direction: column; line-height: 1.05; text-transform: uppercase; font-weight: 700; font-size: 17px; letter-spacing: .04em">Shiv Nadar<span style="font-size: 10px; font-weight: 500; letter-spacing: .26em; margin-top: 3px">University</span></span>
      <span aria-hidden="true" style="width: 2px; height: 44px; background: #FFA700"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 700; font-size: 16px">Placement Question Bank</span><span style="font-size: 13px; color: #5F5F5E">Career Development Centre</span></span>
    </a>
    <nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px">
      <a href="03-Companies.html" aria-current="page">Companies</a>
      <a href="08-Topics.html">Topics</a>
      <a href="07-Search.html">Search</a>
      <a href="11-Bookmarks.html">Bookmarks</a>
      <a href="10-My-submissions.html">My submissions</a>
      <a class="btn" href="S1-Submit-choose-drive.html">Submit OA</a>
    </nav>
  </div></header>

  <main style="flex: 1 1 auto">
    <section style="background: #F7F7F7; border-bottom: 1px solid #E3E3E3">
      <div class="wrap" style="padding-top: 28px; display: flex; flex-direction: column; gap: 18px">
        <nav aria-label="Breadcrumb" class="crumb"><a href="03-Companies.html">Companies</a><span aria-hidden="true">/</span><span aria-current="page">Amazon</span></nav>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <p class="eyebrow">Software · Visiting since 2022</p>
            <h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 700">Amazon</h1>
            <p style="margin: 0; color: #4A4A49">4 drives · 48 questions shared · next OA on 22 October</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <button type="button" class="btn2" aria-pressed="{{savedAttr}}" onClick="{{toggleSave}}" style="{{saveStyle}}">{{saveLabel}}</button>
            <a class="btn" href="S1-Submit-choose-drive.html">Share an Amazon OA</a>
          </div>
        </div>
        <div role="tablist" aria-label="Drive year" style="display: flex; overflow-x: auto; margin-top: 8px">
          <template data-sc-for list="{{years}}" as="y" hint-placeholder-count="4">
            <button type="button" role="tab" class="tab" aria-selected="{{y.on}}" onClick="{{y.pick}}">{{y.label}}</button>
          </template>
        </div>
      </div>
    </section>

    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; padding-top: 44px; padding-bottom: 64px">
      <section aria-labelledby="r-h" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
        <h2 id="r-h" style="margin: 0 0 8px; font-size: 26px; font-weight: 700">{{year}} drive · rounds</h2>
        <template data-sc-for list="{{rounds}}" as="r" hint-placeholder-count="3">
          <article style="display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px 20px; padding: 28px 0; border-top: 1px solid #E3E3E3">
            <span style="font-size: 40px; font-weight: 700; line-height: 1; color: #CD1739">{{r.step}}</span>
            <div style="display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: baseline">
                <h3 style="margin: 0; font-size: 22px; font-weight: 700">{{r.name}}</h3>
                <span style="font-size: 14px; color: #5F5F5E">{{r.date}}</span>
              </div>
              <dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
                <div><dt class="lbl">Format</dt><dd style="margin: 0">{{r.format}}</dd></div>
                <div><dt class="lbl">Platform</dt><dd style="margin: 0">{{r.platform}}</dd></div>
                <div><dt class="lbl">Duration</dt><dd style="margin: 0">{{r.duration}}</dd></div>
              </dl>
              <template data-sc-if value="{{r.has}}" hint-placeholder-val="{{ true }}">
                <a href="05-Round-detail.html" style="align-self: flex-start; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; text-decoration: none; min-height: 44px">
                  Read {{r.count}} questions
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
              </template>
              <template data-sc-if value="{{r.none}}" hint-placeholder-val="{{ false }}">
                <p style="margin: 0; font-size: 15px; color: #4A4A49">No questions shared for this round yet. <a href="S1-Submit-choose-drive.html" style="font-weight: 700">Were you in it?</a></p>
              </template>
            </div>
          </article>
        </template>
      </section>

      <aside aria-labelledby="o-h" style="flex: 1 1 300px; align-self: flex-start; border-top: 4px solid #2B2B2B; background: #F7F7F7; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 id="o-h" style="margin: 0; font-size: 18px; font-weight: 700">{{year}} at a glance</h2>
        <dl style="margin: 0; display: flex; flex-direction: column; gap: 14px">
          <div><dt class="lbl">Roles</dt><dd style="margin: 0; font-weight: 500">SDE intern, SDE I</dd></div>
          <div><dt class="lbl">CTC</dt><dd style="margin: 0; font-weight: 500">[As shared by CDC]</dd></div>
          <div><dt class="lbl">Eligibility</dt><dd style="margin: 0; font-weight: 500">B.Tech CSE and ECE, CGPA 7.0 and above, no active backlogs</dd></div>
          <div><dt class="lbl">Most asked</dt><dd style="margin: 4px 0 0; display: flex; flex-direction: column; gap: 4px"><a href="07-Search.html">Sliding window</a><a href="07-Search.html">Graphs</a><a href="07-Search.html">Dynamic programming</a><a href="07-Search.html">Work style questions</a></dd></div>
        </dl>
      </aside>
    </div>
  </main>

  <footer class="ftr">
    <div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; padding-top: 44px; padding-bottom: 36px">
      <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 12px">
        <span style="color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase">Career Development Centre</span>
        <span style="font-size: 14px; font-weight: 300; line-height: 1.7">Shiv Nadar Institution of Eminence, Delhi NCR. Questions are shared by students who sat the test and checked by the CDC. For SNU students only.</span>
      </div>
      <nav aria-label="Footer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 48px; font-size: 14px; font-weight: 500">
        <a href="03-Companies.html">Companies</a><a href="13-Help-and-FAQ.html">Help and FAQ</a><a href="S1-Submit-choose-drive.html">Submit an OA</a><a href="13-Help-and-FAQ.html">Honour code</a><a href="10-My-submissions.html">My submissions</a><a href="13-Help-and-FAQ.html">Contact the CDC</a>
      </nav>
    </div>
    <div style="border-top: 1px solid rgb(255 255 255 / 40%)"><div class="wrap" style="padding-top: 14px; padding-bottom: 14px; font-size: 13px">© Career Development Centre, Shiv Nadar IoE</div></div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1600}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { year: '2025', saved: true }; }
  renderVals() {
    const sel = this.state.year;
    const years = ['2025', '2024', '2023', '2022'].map((label) => ({ label, on: label === sel ? 'true' : 'false', pick: () => this.setState({ year: label }) }));
    const r = (step, name, date, format, platform, duration, count) => ({ step, name, date, format, platform, duration, count, has: count > 0, none: count === 0 });
    const byYear = {
      '2025': [r('01', 'Online assessment', '14 Aug 2025', '2 coding questions and a work style survey', 'HackerRank', '105 min', 14), r('02', 'Technical interview', '28 Aug 2025', 'Data structures and problem solving', 'Amazon Chime', '60 min', 3), r('03', 'Bar raiser and HR', '29 Aug 2025', 'Leadership principles', 'On campus', '45 min', 0)],
      '2024': [r('01', 'Online assessment', '9 Aug 2024', '2 coding and 15 MCQ', 'HackerRank', '90 min', 12), r('02', 'Technical interview', '22 Aug 2024', 'Data structures', 'Amazon Chime', '60 min', 4)],
      '2023': [r('01', 'Online assessment', '17 Aug 2023', '2 coding and a debugging section', 'HackerEarth', '90 min', 9)],
      '2022': [r('01', 'Online assessment', '3 Sep 2022', '2 coding', 'HackerRank', '70 min', 6)]
    };
    const s = this.state.saved;
    return { years, year: sel, rounds: byYear[sel],
      savedAttr: s ? 'true' : 'false', saveLabel: s ? 'Following' : 'Follow company',
      saveStyle: s ? 'background: #2B2B2B; color: #FFFFFF' : '',
      toggleSave: () => this.setState({ saved: !s }) };
  }
}
</script>
</body>
</html>

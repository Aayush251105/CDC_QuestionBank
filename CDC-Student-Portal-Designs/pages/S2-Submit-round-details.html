<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2 · Submit: round details · CDC Student Portal</title>
<script src="support.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#CD1739}a:hover{color:#A51230}
:focus-visible{outline:2px solid #2B2B2B;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.top{background:#2B2B2B;color:#F4E6CD;font-size:13px}
.top a{color:#F4E6CD;text-decoration:none}.top a:hover{color:#FFFFFF;text-decoration:underline}
.hdr{background:#FFFFFF;border-bottom:1px solid #E3E3E3}
.nav a{color:#2B2B2B;text-decoration:none;font-weight:700;font-size:15px;padding:24px 0 22px;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:#CD1739;border-bottom-color:#CD1739}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;background:#CD1739;color:#FFFFFF;border:1px solid #CD1739;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#A51230;border-color:#A51230;color:#FFFFFF}
.nav a.btn{padding:0 22px;min-height:46px;border-bottom:1px solid #CD1739;color:#FFFFFF}
.nav a.btn[aria-current="page"]{background:#A51230;border-color:#A51230}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;background:transparent;color:#2B2B2B;border:1px solid #2B2B2B;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn2:hover{background:#2B2B2B;color:#FFFFFF}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#CD1739}
.field{width:100%;min-height:48px;padding:0 14px;border:1px solid #8C8C8B;background:#FFFFFF;font:inherit;font-size:16px;color:#2B2B2B;border-radius:0}
.field:focus{border-color:#2B2B2B;outline:none;box-shadow:0 0 0 1px #2B2B2B}
.lbl{font-size:14px;font-weight:700}
.hint{font-size:14px;color:#5F5F5E}
.seg{min-height:48px;padding:0 18px;border:1px solid #8C8C8B;margin-left:-1px;background:#FFFFFF;font:inherit;font-size:15px;font-weight:500;color:#2B2B2B;cursor:pointer}
.seg[aria-checked="true"]{background:#2B2B2B;border-color:#2B2B2B;color:#FFFFFF;font-weight:700;position:relative}
.ftr{background:#2B2B2B;color:#F4E6CD}
.ftr a{color:#FFFFFF;text-decoration:none}.ftr a:hover{text-decoration:underline}
</style>
</helmet>
<div style="font-family: 'DM Sans', sans-serif; color: #2B2B2B; background: #FFFFFF; min-height: 100vh; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column">

  <div class="top"><div class="wrap" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; padding-top: 8px; padding-bottom: 8px"><span>Career Development Centre · Shiv Nadar Institution of Eminence</span><span style="display: flex; gap: 20px"><a href="13-Help-and-FAQ.html">Help</a><a href="10-My-submissions.html">Notifications (1)</a><a href="12-Profile.html">Aarav Sharma</a></span></div></div>
  <header class="hdr"><div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 32px">
    <a href="02-Home.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; text-decoration: none; color: #2B2B2B">
      <span style="display: flex; flex-direction: column; line-height: 1.05; text-transform: uppercase; font-weight: 700; font-size: 17px; letter-spacing: .04em">Shiv Nadar<span style="font-size: 10px; font-weight: 500; letter-spacing: .26em; margin-top: 3px">University</span></span>
      <span aria-hidden="true" style="width: 2px; height: 44px; background: #FFA700"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 700; font-size: 16px">Placement Question Bank</span><span style="font-size: 13px; color: #5F5F5E">Career Development Centre</span></span>
    </a>
    <nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px">
      <a href="03-Companies.html">Companies</a>
      <a href="08-Topics.html">Topics</a>
      <a href="07-Search.html">Search</a>
      <a href="11-Bookmarks.html">Bookmarks</a>
      <a href="10-My-submissions.html">My submissions</a>
      <a class="btn" href="S1-Submit-choose-drive.html" aria-current="page">Submit OA</a>
    </nav>
  </div></header>

  <main style="flex: 1 1 auto">
    <section style="background: #F7F7F7; border-bottom: 1px solid #E3E3E3">
      <div class="wrap" style="padding-top: 36px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 10px">
        <p class="eyebrow">Submit an OA · Step 2 of 4</p>
        <h1 style="margin: 0; font-size: 38px; line-height: 1.15; font-weight: 700">Tell us about the round</h1>
        <ol aria-label="Steps" style="list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; max-width: 760px">
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #2B2B2B"></span><a href="S1-Submit-choose-drive.html" style="font-size: 14px; font-weight: 700; color: #2B2B2B">1 · Drive, done</a></li>
          <li aria-current="step" style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #CD1739"></span><span style="font-size: 14px; font-weight: 700; color: #CD1739">2 · Round</span></li>
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #D4D4D3"></span><span style="font-size: 14px; color: #5F5F5E">3 · Questions</span></li>
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #D4D4D3"></span><span style="font-size: 14px; color: #5F5F5E">4 · Review</span></li>
        </ol>
      </div>
    </section>

    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; padding-top: 36px; padding-bottom: 64px">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span class="lbl" id="rt-l">Round type</span>
          <div role="radiogroup" aria-labelledby="rt-l" style="display: flex; flex-wrap: wrap; padding-left: 1px">
            <template data-sc-for list="{{rtypes}}" as="r" hint-placeholder-count="4">
              <button type="button" role="radio" class="seg" aria-checked="{{r.on}}" onClick="{{r.pick}}">{{r.label}}</button>
            </template>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px">
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="dt" class="lbl">Test date</label><input id="dt" class="field" type="date" value="2025-08-14"></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="pf" class="lbl">Platform</label><select id="pf" class="field"><option>HackerRank</option><option>HackerEarth</option><option>Mettl</option><option>CoCubes</option><option>Other</option></select></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="du" class="lbl">Duration in minutes</label><input id="du" class="field" type="number" value="105"></div>
        </div>
        <p class="hint" style="margin: -16px 0 0">Platform and duration are filled in from what other students reported for this round. Change them if yours differed.</p>

        <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
          <legend class="lbl" style="margin-bottom: 4px">Sections in the test <span style="font-weight: 400; color: #5F5F5E">(optional)</span></legend>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 140px 48px; gap: 8px; align-items: end">
            <span class="hint">Section</span><span class="hint">Questions</span><span></span>
            <input class="field" aria-label="Section 1 name" value="Coding">
            <input class="field" aria-label="Section 1 question count" type="number" value="2">
            <button type="button" aria-label="Remove section 1" style="width: 48px; height: 48px; border: 1px solid #BFBFBC; background: #FFFFFF; cursor: pointer; color: #2B2B2B"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            <input class="field" aria-label="Section 2 name" value="Work style survey">
            <input class="field" aria-label="Section 2 question count" type="number" value="20">
            <button type="button" aria-label="Remove section 2" style="width: 48px; height: 48px; border: 1px solid #BFBFBC; background: #FFFFFF; cursor: pointer; color: #2B2B2B"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <button type="button" style="align-self: flex-start; min-height: 44px; border: none; background: none; padding: 0; color: #CD1739; font: inherit; font-weight: 700; cursor: pointer">Add a section</button>
        </fieldset>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="nt" class="lbl">Anything else about the test? <span style="font-weight: 400; color: #5F5F5E">(optional)</span></label>
          <textarea id="nt" class="field" rows="3" style="padding: 12px 14px; min-height: 96px; resize: vertical">Camera proctored. No negative marking. Could switch between questions freely.</textarea>
        </div>

        <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E3E3E3; padding-top: 24px">
          <legend class="lbl" style="font-size: 20px; margin-bottom: 12px">How will you add the questions?</legend>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
            <template data-sc-for list="{{methods}}" as="m" hint-placeholder-count="2">
              <label style="{{m.style}}">
                <input type="radio" name="method" checked="{{m.on}}" onChange="{{m.pick}}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #CD1739">
                <span style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">{{m.title}}</strong><span class="hint">{{m.sub}}</span></span>
              </label>
            </template>
          </div>
          <p class="hint" style="margin: 0">You can switch later, or use both: type some questions and upload the rest.</p>
        </fieldset>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-top: 2px solid #2B2B2B; padding-top: 20px">
          <a class="btn2" href="S1-Submit-choose-drive.html">Back</a>
          <span class="hint" style="flex: 1 1 auto; text-align: right">Draft saved just now</span>
          <a class="btn" href="{{nextHref}}">{{nextLabel}}</a>
        </div>
      </div>

      <aside style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 28px">
        <section style="border-top: 4px solid #2B2B2B; background: #F7F7F7; padding: 24px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #CD1739">Your submission</h2>
          <dl style="margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px">
            <div><dt class="hint">Company</dt><dd style="margin: 0; font-weight: 700">Amazon</dd></div>
            <div><dt class="hint">Drive</dt><dd style="margin: 0; font-weight: 700">2025 · SDE intern</dd></div>
          </dl>
          <a href="S1-Submit-choose-drive.html" style="font-weight: 700; font-size: 15px">Change drive</a>
        </section>
      </aside>
    </div>
  </main>

  <footer class="ftr">
    <div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; padding-top: 44px; padding-bottom: 36px">
      <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 12px">
        <span style="color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase">Career Development Centre</span>
        <span style="font-size: 14px; font-weight: 300; line-height: 1.7">Shiv Nadar Institution of Eminence, Delhi NCR. Questions are shared by students who sat the test and checked by the CDC. For SNU students only.</span>
      </div>
      <nav aria-label="Footer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 48px; font-size: 14px; font-weight: 500">
        <a href="03-Companies.html">Companies</a><a href="13-Help-and-FAQ.html">Help and FAQ</a><a href="S1-Submit-choose-drive.html">Submit an OA</a><a href="13-Help-and-FAQ.html">Honour code</a><a href="10-My-submissions.html">My submissions</a><a href="13-Help-and-FAQ.html">Contact the CDC</a>
      </nav>
    </div>
    <div style="border-top: 1px solid rgb(255 255 255 / 40%)"><div class="wrap" style="padding-top: 14px; padding-bottom: 14px; font-size: 13px">© Career Development Centre, Shiv Nadar IoE</div></div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1300}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { rt: 'Online assessment', method: 'type' }; }
  renderVals() {
    const rtypes = ['Online assessment', 'Technical interview', 'HR interview', 'Group discussion'].map((label) => ({
      label, on: this.state.rt === label ? 'true' : 'false', pick: () => this.setState({ rt: label }) }));
    const base = 'display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 14px; align-items: start; padding: 20px; cursor: pointer; background: #FFFFFF; ';
    const methods = [
      { key: 'type', title: 'Type them in', sub: 'Best when you remember the questions clearly. A form per question.' },
      { key: 'scan', title: 'Upload photos or a PDF', sub: 'Rough sheets or notes, up to 10 pages. We read the text for you.' }
    ].map((m) => {
      const on = this.state.method === m.key;
      return { ...m, on, style: base + (on ? 'border: 2px solid #CD1739; padding: 19px' : 'border: 1px solid #BFBFBC'), pick: () => this.setState({ method: m.key }) };
    });
    const t = this.state.method === 'type';
    return { rtypes, methods, nextHref: t ? 'S3a-Submit-type-questions.html' : 'S3b-Submit-upload-scans.html', nextLabel: t ? 'Continue to type questions' : 'Continue to upload' };
  }
}
</script>
</body>
</html>

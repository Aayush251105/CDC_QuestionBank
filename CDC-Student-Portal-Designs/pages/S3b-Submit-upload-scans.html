<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3b · Submit: upload scans · CDC Student Portal</title>
<script src="support.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#CD1739}a:hover{color:#A51230}
:focus-visible{outline:2px solid #2B2B2B;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.top{background:#2B2B2B;color:#F4E6CD;font-size:13px}
.top a{color:#F4E6CD;text-decoration:none}.top a:hover{color:#FFFFFF;text-decoration:underline}
.hdr{background:#FFFFFF;border-bottom:1px solid #E3E3E3}
.nav a{color:#2B2B2B;text-decoration:none;font-weight:700;font-size:15px;padding:24px 0 22px;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:#CD1739;border-bottom-color:#CD1739}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;background:#CD1739;color:#FFFFFF;border:1px solid #CD1739;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#A51230;border-color:#A51230;color:#FFFFFF}
.btn[aria-disabled="true"]{background:#D4D4D3;border-color:#D4D4D3;color:#4A4A49;cursor:not-allowed}
.nav a.btn{padding:0 22px;min-height:46px;border-bottom:1px solid #CD1739;color:#FFFFFF}
.nav a.btn[aria-current="page"]{background:#A51230;border-color:#A51230}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;background:transparent;color:#2B2B2B;border:1px solid #2B2B2B;font:inherit;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.btn2:hover{background:#2B2B2B;color:#FFFFFF}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#CD1739}
.hint{font-size:14px;color:#5F5F5E}
.ftr{background:#2B2B2B;color:#F4E6CD}
.ftr a{color:#FFFFFF;text-decoration:none}.ftr a:hover{text-decoration:underline}
@keyframes grow{from{width:20%}to{width:75%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="font-family: 'DM Sans', sans-serif; color: #2B2B2B; background: #FFFFFF; min-height: 100vh; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column">

  <div class="top"><div class="wrap" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; padding-top: 8px; padding-bottom: 8px"><span>Career Development Centre · Shiv Nadar Institution of Eminence</span><span style="display: flex; gap: 20px"><a href="13-Help-and-FAQ.html">Help</a><a href="10-My-submissions.html">Notifications (1)</a><a href="12-Profile.html">Aarav Sharma</a></span></div></div>
  <header class="hdr"><div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 32px">
    <a href="02-Home.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; text-decoration: none; color: #2B2B2B">
      <span style="display: flex; flex-direction: column; line-height: 1.05; text-transform: uppercase; font-weight: 700; font-size: 17px; letter-spacing: .04em">Shiv Nadar<span style="font-size: 10px; font-weight: 500; letter-spacing: .26em; margin-top: 3px">University</span></span>
      <span aria-hidden="true" style="width: 2px; height: 44px; background: #FFA700"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 700; font-size: 16px">Placement Question Bank</span><span style="font-size: 13px; color: #5F5F5E">Career Development Centre</span></span>
    </a>
    <nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px">
      <a href="03-Companies.html">Companies</a>
      <a href="08-Topics.html">Topics</a>
      <a href="07-Search.html">Search</a>
      <a href="11-Bookmarks.html">Bookmarks</a>
      <a href="10-My-submissions.html">My submissions</a>
      <a class="btn" href="S1-Submit-choose-drive.html" aria-current="page">Submit OA</a>
    </nav>
  </div></header>

  <main style="flex: 1 1 auto">
    <section style="background: #F7F7F7; border-bottom: 1px solid #E3E3E3">
      <div class="wrap" style="padding-top: 36px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 10px">
        <p class="eyebrow">Submit an OA · Step 3 of 4 · Amazon 2025 online assessment</p>
        <h1 style="margin: 0; font-size: 38px; line-height: 1.15; font-weight: 700">Upload your sheets</h1>
        <ol aria-label="Steps" style="list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; max-width: 760px">
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #2B2B2B"></span><a href="S1-Submit-choose-drive.html" style="font-size: 14px; font-weight: 700; color: #2B2B2B">1 · Drive, done</a></li>
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #2B2B2B"></span><a href="S2-Submit-round-details.html" style="font-size: 14px; font-weight: 700; color: #2B2B2B">2 · Round, done</a></li>
          <li aria-current="step" style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #CD1739"></span><span style="font-size: 14px; font-weight: 700; color: #CD1739">3 · Questions</span></li>
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #D4D4D3"></span><span style="font-size: 14px; color: #5F5F5E">4 · Review</span></li>
        </ol>
      </div>
    </section>

    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; padding-top: 36px; padding-bottom: 64px">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">

        <label for="up" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 24px; border: 2px dashed #8C8C8B; background: #F7F7F7; text-align: center; cursor: pointer">
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#CD1739" stroke-width="1.8" stroke-linecap="square"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v5h16v-5"/></svg>
          <strong style="font-size: 19px">Drop photos or a PDF here</strong>
          <span class="hint">or <span style="color: #CD1739; font-weight: 700; text-decoration: underline">choose files</span> · JPG, PNG or PDF · up to 10 pages, 15 MB</span>
          <input id="up" type="file" multiple class="sr">
        </label>

        <div style="display: flex; flex-direction: column">
          <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #2B2B2B; padding-bottom: 10px">
            <h2 style="margin: 0; font-size: 20px; font-weight: 700">rough-sheet.pdf · 3 pages</h2>
            <span aria-live="polite" class="hint">{{progressText}}</span>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0">
            <li style="display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; padding: 18px 0; border-bottom: 1px solid #E3E3E3">
              <span aria-hidden="true" style="width: 72px; height: 92px; background: #EFEFEF; border: 1px solid #D4D4D3; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5F5F5E">Page 1</span>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap"><strong>Page 1</strong><span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #23683A">Text read · 2 questions found</span></div>
                <p class="hint" style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6">Q1. given string s and int k, find longest substring with at most k distinct chars…</p>
              </div>
            </li>
            <li style="display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; padding: 18px 0; border-bottom: 1px solid #E3E3E3">
              <span aria-hidden="true" style="width: 72px; height: 92px; background: #EFEFEF; border: 1px solid #D4D4D3; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5F5F5E">Page 2</span>
              <div style="display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap"><strong>Page 2</strong><span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{p2color}}">{{p2label}}</span></div>
                <template data-sc-if value="{{reading}}" hint-placeholder-val="{{ true }}">
                  <span role="progressbar" aria-label="Reading page 2" style="display: block; height: 6px; background: #E3E3E3"><span style="display: block; height: 6px; width: 60%; background: #CD1739; animation: grow 2.4s ease-out infinite alternate"></span></span>
                </template>
                <template data-sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
                  <p class="hint" style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6">Q2. packages w[i] ship in order, one truck per day max C, find min C within D days…</p>
                </template>
              </div>
            </li>
            <li style="display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; padding: 18px 0; border-bottom: 1px solid #E3E3E3">
              <span aria-hidden="true" style="width: 72px; height: 92px; background: #EFEFEF; border: 1px solid #D4D4D3; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5F5F5E">Page 3</span>
              <div style="display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap"><strong>Page 3</strong><span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #CD1739">Could not read</span></div>
                <p style="margin: 0; font-size: 15px">The photo is too blurry to read. Retake it in good light, or type this page's questions instead.</p>
                <div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" class="btn2">Replace photo</button><a class="btn2" href="S3a-Submit-type-questions.html">Type it instead</a></div>
              </div>
            </li>
          </ul>
        </div>

        <p style="margin: 0; display: flex; gap: 10px; padding: 16px 20px; background: #FEE8CD; font-size: 15px">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none; margin-top: 2px"><rect x="4" y="11" width="16" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span><strong>Your images are not kept.</strong> Each page is read once and deleted straight away. Only the text is saved, and you check it on the next step.</span>
        </p>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-top: 2px solid #2B2B2B; padding-top: 20px">
          <a class="btn2" href="S2-Submit-round-details.html" style="min-height: 48px">Back</a>
          <span class="hint" style="flex: 1 1 auto; text-align: right">{{footText}}</span>
          <a class="btn" href="S4-Submit-review-and-confirm.html" aria-disabled="{{notReady}}">Continue to review</a>
        </div>
      </div>

      <aside style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 28px">
        <section style="border-top: 4px solid #2B2B2B; background: #F7F7F7; padding: 24px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 700">For photos that read well</h2>
          <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px">
            <li>One page per photo, flat and fully in frame.</li>
            <li>Daylight or a bright lamp; no shadow across the text.</li>
            <li>Number your questions on the sheet if you can.</li>
            <li>Code is fine; we keep its spacing.</li>
          </ul>
        </section>
        <section style="display: flex; flex-direction: column; gap: 8px; font-size: 15px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #CD1739">What happens to unclear words</h2>
          <p style="margin: 0">We mark them [unclear] instead of guessing. You fill them in on the review step.</p>
        </section>
      </aside>
    </div>
  </main>

  <footer class="ftr">
    <div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; padding-top: 44px; padding-bottom: 36px">
      <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 12px">
        <span style="color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase">Career Development Centre</span>
        <span style="font-size: 14px; font-weight: 300; line-height: 1.7">Shiv Nadar Institution of Eminence, Delhi NCR. Questions are shared by students who sat the test and checked by the CDC. For SNU students only.</span>
      </div>
      <nav aria-label="Footer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 48px; font-size: 14px; font-weight: 500">
        <a href="03-Companies.html">Companies</a><a href="13-Help-and-FAQ.html">Help and FAQ</a><a href="S1-Submit-choose-drive.html">Submit an OA</a><a href="13-Help-and-FAQ.html">Honour code</a><a href="10-My-submissions.html">My submissions</a><a href="13-Help-and-FAQ.html">Contact the CDC</a>
      </nav>
    </div>
    <div style="border-top: 1px solid rgb(255 255 255 / 40%)"><div class="wrap" style="padding-top: 14px; padding-bottom: 14px; font-size: 13px">© Career Development Centre, Shiv Nadar IoE</div></div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["Reading","Finished"],"default":"Reading"},"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const reading = (this.props.state ?? 'Reading') === 'Reading';
    return {
      reading, done: !reading,
      p2label: reading ? 'Reading…' : 'Text read · 1 question found', p2color: reading ? '#2B2B2B' : '#23683A',
      progressText: reading ? 'Reading page 2 of 3' : '2 of 3 pages read',
      footText: reading ? 'You can continue once reading finishes' : '3 questions found · page 3 needs attention',
      notReady: reading ? 'true' : 'false'
    };
  }
}
</script>
</body>
</html>

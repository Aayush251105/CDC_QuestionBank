<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 · Home · CDC Student Portal</title>
<script src="support.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#CD1739}a:hover{color:#A51230}
:focus-visible{outline:2px solid #2B2B2B;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.top{background:#2B2B2B;color:#F4E6CD;font-size:13px}
.top a{color:#F4E6CD;text-decoration:none}.top a:hover{color:#FFFFFF;text-decoration:underline}
.hdr{background:#FFFFFF;border-bottom:1px solid #E3E3E3}
.nav a{color:#2B2B2B;text-decoration:none;font-weight:700;font-size:15px;padding:24px 0 22px;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:#CD1739;border-bottom-color:#CD1739}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;background:#CD1739;color:#FFFFFF;border:1px solid #CD1739;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#A51230;border-color:#A51230;color:#FFFFFF}
.nav a.btn{padding:0 22px;border-bottom:1px solid #CD1739;color:#FFFFFF}
.nav a.btn:hover{border-bottom-color:#A51230;color:#FFFFFF}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;background:transparent;color:#2B2B2B;border:1px solid #2B2B2B;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn2:hover{background:#2B2B2B;color:#FFFFFF}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#CD1739}
.field{width:100%;min-height:52px;padding:0 16px;border:1px solid #8C8C8B;background:#FFFFFF;font:inherit;font-size:17px;color:#2B2B2B}
.field:focus{border-color:#2B2B2B;outline:none;box-shadow:0 0 0 1px #2B2B2B}
.more{font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:16px 0;border-bottom:1px solid #E3E3E3;text-decoration:none;color:#2B2B2B}
.qrow:hover .qt{color:#CD1739}
.ftr{background:#2B2B2B;color:#F4E6CD}
.ftr a{color:#FFFFFF;text-decoration:none}.ftr a:hover{text-decoration:underline}
</style>
</helmet>
<div style="font-family: 'DM Sans', sans-serif; color: #2B2B2B; background: #FFFFFF; min-height: 100vh; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column">

  <div class="top"><div class="wrap" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; padding-top: 8px; padding-bottom: 8px"><span>Career Development Centre · Shiv Nadar Institution of Eminence</span><span style="display: flex; gap: 20px"><a href="13-Help-and-FAQ.html">Help</a><a href="10-My-submissions.html">Notifications (1)</a><a href="12-Profile.html">Aarav Sharma</a></span></div></div>
  <header class="hdr"><div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 32px">
    <a href="02-Home.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; text-decoration: none; color: #2B2B2B">
      <span style="display: flex; flex-direction: column; line-height: 1.05; text-transform: uppercase; font-weight: 700; font-size: 17px; letter-spacing: .04em">Shiv Nadar<span style="font-size: 10px; font-weight: 500; letter-spacing: .26em; margin-top: 3px">University</span></span>
      <span aria-hidden="true" style="width: 2px; height: 44px; background: #FFA700"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 700; font-size: 16px">Placement Question Bank</span><span style="font-size: 13px; color: #5F5F5E">Career Development Centre</span></span>
    </a>
    <nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px">
      <a href="03-Companies.html">Companies</a>
      <a href="08-Topics.html">Topics</a>
      <a href="07-Search.html">Search</a>
      <a href="11-Bookmarks.html">Bookmarks</a>
      <a href="10-My-submissions.html">My submissions</a>
      <a class="btn" href="S1-Submit-choose-drive.html">Submit OA</a>
    </nav>
  </div></header>

  <main style="flex: 1 1 auto">
    <section style="background: #F7F7F7; border-bottom: 1px solid #E3E3E3">
      <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px; align-items: stretch; padding-top: 56px; padding-bottom: 56px">
        <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 20px">
          <p class="eyebrow">Good morning, Aarav</p>
          <h1 style="margin: 0; font-size: 46px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; max-width: 640px">Find the questions companies asked at SNU.</h1>
          <div role="search" style="display: flex; flex-wrap: wrap; gap: 0; max-width: 640px">
            <label for="hero-q" class="sr">Search questions, companies and topics</label>
            <input id="hero-q" class="field" type="search" placeholder="Company, topic or a few words of the question" style="flex: 1 1 300px; width: auto">
            <a class="btn" href="07-Search.html" style="min-height: 52px; padding: 0 28px">Search</a>
          </div>
          <p style="margin: 0; font-size: 15px; color: #4A4A49">Try <a href="07-Search.html">Amazon 2025</a>, <a href="07-Search.html">sliding window</a>, <a href="07-Search.html">SQL joins</a> or <a href="07-Search.html">quant aptitude</a>.</p>
        </div>
        <aside aria-labelledby="soon-h" style="flex: 1 1 340px; background: #CD1739; color: #FFFFFF; padding: 32px; display: flex; flex-direction: column; gap: 18px">
          <h2 id="soon-h" style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase">Visiting campus this month</h2>
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
            <template data-sc-for list="{{soon}}" as="c" hint-placeholder-count="4">
              <li style="border-top: 1px solid rgb(255 255 255 / 35%)">
                <a href="04-Company-detail.html" style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; color: #FFFFFF; text-decoration: none">
                  <span style="display: flex; flex-direction: column; line-height: 1.3"><strong style="font-size: 17px">{{c.name}}</strong><span style="font-size: 14px; opacity: .9">{{c.role}}</span></span>
                  <span style="text-align: right; font-size: 14px; line-height: 1.3"><strong style="display: block">{{c.date}}</strong>{{c.count}} questions</span>
                </a>
              </li>
            </template>
          </ul>
          <a href="03-Companies.html" style="color: #FFFFFF; font-weight: 700; font-size: 15px">All companies</a>
        </aside>
      </div>
    </section>

    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; padding-top: 56px; padding-bottom: 64px">
      <section aria-labelledby="recent-h" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <p class="eyebrow">Just published</p>
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid #2B2B2B; padding-bottom: 12px">
          <h2 id="recent-h" style="margin: 0; font-size: 30px; font-weight: 700">Recently added questions</h2>
          <a class="more" href="07-Search.html">View all</a>
        </div>
        <div>
          <template data-sc-for list="{{recent}}" as="q" hint-placeholder-count="6">
            <a class="qrow" href="06-Question-detail.html">
              <span class="qt" style="font-weight: 700; font-size: 17px">{{q.title}}</span>
              <span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #4A4A49; align-self: center">{{q.type}}</span>
              <span style="font-size: 14px; color: #5F5F5E">{{q.where}}</span>
              <span style="font-size: 14px; color: #5F5F5E; text-align: right">{{q.diff}}</span>
            </a>
          </template>
        </div>
      </section>

      <aside style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 40px">
        <section aria-labelledby="mine-h" style="display: flex; flex-direction: column; gap: 8px">
          <p class="eyebrow">Following</p>
          <h2 id="mine-h" style="margin: 0; font-size: 22px; font-weight: 700; border-bottom: 2px solid #2B2B2B; padding-bottom: 12px">Your companies</h2>
          <ul style="margin: 0; padding: 0; list-style: none">
            <template data-sc-for list="{{saved}}" as="s" hint-placeholder-count="3">
              <li><a href="04-Company-detail.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #E3E3E3; text-decoration: none; color: #2B2B2B"><strong>{{s.name}}</strong><span style="font-size: 14px; font-weight: 700; color: #CD1739">{{s.fresh}} new</span></a></li>
            </template>
          </ul>
          <a class="more" href="11-Bookmarks.html" style="margin-top: 6px">Manage bookmarks</a>
        </section>

        <section aria-labelledby="share-h" style="background: #FEE8CD; padding: 28px; display: flex; flex-direction: column; gap: 12px">
          <p class="eyebrow" style="color: #2B2B2B">Give back</p>
          <h2 id="share-h" style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700">Sat an OA this week?</h2>
          <p style="margin: 0; font-size: 15px">Share the questions while they are fresh. Type them in or upload photos of your rough sheet. It takes about five minutes and you stay anonymous.</p>
          <a class="btn" href="S1-Submit-choose-drive.html" style="align-self: flex-start">Submit an OA</a>
        </section>
      </aside>
    </div>

    <section style="border-top: 1px solid #E3E3E3; background: #F7F7F7">
      <div class="wrap" style="display: flex; flex-direction: column; gap: 20px; padding-top: 48px; padding-bottom: 56px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap">
          <div style="display: flex; flex-direction: column; gap: 6px"><p class="eyebrow">Explore</p><h2 style="margin: 0; font-size: 30px; font-weight: 700">Practise by topic</h2></div>
          <a class="more" href="08-Topics.html">All topics</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: #E3E3E3; border: 1px solid #E3E3E3">
          <template data-sc-for list="{{topics}}" as="t" hint-placeholder-count="8">
            <a href="07-Search.html" style="background: #FFFFFF; padding: 18px; text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 2px">
              <strong>{{t.name}}</strong><span style="font-size: 14px; color: #5F5F5E">{{t.n}} questions</span>
            </a>
          </template>
        </div>
      </div>
    </section>
  </main>

  <footer class="ftr">
    <div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; padding-top: 44px; padding-bottom: 36px">
      <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 12px">
        <span style="color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase">Career Development Centre</span>
        <span style="font-size: 14px; font-weight: 300; line-height: 1.7">Shiv Nadar Institution of Eminence, Delhi NCR. Questions are shared by students who sat the test and checked by the CDC. For SNU students only.</span>
      </div>
      <nav aria-label="Footer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 48px; font-size: 14px; font-weight: 500">
        <a href="03-Companies.html">Companies</a><a href="13-Help-and-FAQ.html">Help and FAQ</a><a href="S1-Submit-choose-drive.html">Submit an OA</a><a href="13-Help-and-FAQ.html">Honour code</a><a href="10-My-submissions.html">My submissions</a><a href="13-Help-and-FAQ.html">Contact the CDC</a>
      </nav>
    </div>
    <div style="border-top: 1px solid rgb(255 255 255 / 40%)"><div class="wrap" style="padding-top: 14px; padding-bottom: 14px; font-size: 13px">© Career Development Centre, Shiv Nadar IoE</div></div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1700}}'>

    return {
      soon: [
        { name: 'Amazon', role: 'SDE intern', date: '22 Oct', count: 48 },
        { name: 'Deloitte', role: 'Analyst', date: '25 Oct', count: 31 },
        { name: 'Zomato', role: 'Software engineer', date: '29 Oct', count: 12 },
        { name: 'Goldman Sachs', role: 'Engineering analyst', date: '2 Nov', count: 27 }
      ],
      recent: [
        { title: 'Longest substring with at most K distinct characters', where: 'Amazon · 2025 · Online assessment', type: 'Coding', diff: 'Medium' },
        { title: 'Second highest salary in each department', where: 'Deloitte · 2025 · Online assessment', type: 'SQL', diff: 'Easy' },
        { title: 'Two pipes fill a tank while a leak empties it', where: 'TCS · 2025 · Aptitude round', type: 'Aptitude', diff: 'Easy' },
        { title: 'Minimum cost to connect all cities', where: 'Goldman Sachs · 2024 · Online assessment', type: 'Coding', diff: 'Hard' },
        { title: 'Output of the given C pointer snippet', where: 'Samsung R&D · 2025 · Online assessment', type: 'MCQ', diff: 'Medium' },
        { title: 'Count islands after each land addition', where: 'Microsoft · 2024 · Online assessment', type: 'Coding', diff: 'Hard' }
      ],
      saved: [{ name: 'Amazon', fresh: 6 }, { name: 'Microsoft', fresh: 2 }, { name: 'Goldman Sachs', fresh: 1 }],
      topics: [
        { name: 'Arrays and strings', n: 64 }, { name: 'Dynamic programming', n: 41 }, { name: 'Graphs', n: 27 }, { name: 'SQL', n: 29 },
        { name: 'Quantitative aptitude', n: 58 }, { name: 'Logical reasoning', n: 46 }, { name: 'Operating systems', n: 17 }, { name: 'Work style', n: 16 }

  }

</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S1 · Submit: choose drive · CDC Student Portal</title>
<script src="support.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#CD1739}a:hover{color:#A51230}
:focus-visible{outline:2px solid #2B2B2B;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.top{background:#2B2B2B;color:#F4E6CD;font-size:13px}
.top a{color:#F4E6CD;text-decoration:none}.top a:hover{color:#FFFFFF;text-decoration:underline}
.hdr{background:#FFFFFF;border-bottom:1px solid #E3E3E3}
.nav a{color:#2B2B2B;text-decoration:none;font-weight:700;font-size:15px;padding:24px 0 22px;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:#CD1739;border-bottom-color:#CD1739}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;background:#CD1739;color:#FFFFFF;border:1px solid #CD1739;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#A51230;border-color:#A51230;color:#FFFFFF}
.nav a.btn{padding:0 22px;min-height:46px;border-bottom:1px solid #CD1739;color:#FFFFFF}
.nav a.btn[aria-current="page"]{background:#A51230;border-color:#A51230}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;background:transparent;color:#2B2B2B;border:1px solid #2B2B2B;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn2:hover{background:#2B2B2B;color:#FFFFFF}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#CD1739}
.field{width:100%;min-height:48px;padding:0 14px;border:1px solid #8C8C8B;background:#FFFFFF;font:inherit;font-size:16px;color:#2B2B2B;border-radius:0}
.field:focus{border-color:#2B2B2B;outline:none;box-shadow:0 0 0 1px #2B2B2B}
.lbl{font-size:14px;font-weight:700}
.hint{font-size:14px;color:#5F5F5E}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:start;padding:18px;border:1px solid #BFBFBC;cursor:pointer;background:#FFFFFF}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:#CD1739}
.ftr{background:#2B2B2B;color:#F4E6CD}
.ftr a{color:#FFFFFF;text-decoration:none}.ftr a:hover{text-decoration:underline}
</style>
</helmet>
<div style="font-family: 'DM Sans', sans-serif; color: #2B2B2B; background: #FFFFFF; min-height: 100vh; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column">

  <div class="top"><div class="wrap" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; padding-top: 8px; padding-bottom: 8px"><span>Career Development Centre · Shiv Nadar Institution of Eminence</span><span style="display: flex; gap: 20px"><a href="13-Help-and-FAQ.html">Help</a><a href="10-My-submissions.html">Notifications (1)</a><a href="12-Profile.html">Aarav Sharma</a></span></div></div>
  <header class="hdr"><div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 32px">
    <a href="02-Home.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; text-decoration: none; color: #2B2B2B">
      <span style="display: flex; flex-direction: column; line-height: 1.05; text-transform: uppercase; font-weight: 700; font-size: 17px; letter-spacing: .04em">Shiv Nadar<span style="font-size: 10px; font-weight: 500; letter-spacing: .26em; margin-top: 3px">University</span></span>
      <span aria-hidden="true" style="width: 2px; height: 44px; background: #FFA700"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 700; font-size: 16px">Placement Question Bank</span><span style="font-size: 13px; color: #5F5F5E">Career Development Centre</span></span>
    </a>
    <nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px">
      <a href="03-Companies.html">Companies</a>
      <a href="08-Topics.html">Topics</a>
      <a href="07-Search.html">Search</a>
      <a href="11-Bookmarks.html">Bookmarks</a>
      <a href="10-My-submissions.html">My submissions</a>
      <a class="btn" href="S1-Submit-choose-drive.html" aria-current="page">Submit OA</a>
    </nav>
  </div></header>

  <main style="flex: 1 1 auto">
    <section style="background: #F7F7F7; border-bottom: 1px solid #E3E3E3">
      <div class="wrap" style="padding-top: 36px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 10px">
        <p class="eyebrow">Submit an OA · Step 1 of 4</p>
        <h1 style="margin: 0; font-size: 38px; line-height: 1.15; font-weight: 700">Which drive was it?</h1>
        <ol aria-label="Steps" style="list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; max-width: 760px">
          <li aria-current="step" style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #CD1739"></span><span style="font-size: 14px; font-weight: 700; color: #CD1739">1 · Drive</span></li>
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #D4D4D3"></span><span style="font-size: 14px; color: #5F5F5E">2 · Round</span></li>
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #D4D4D3"></span><span style="font-size: 14px; color: #5F5F5E">3 · Questions</span></li>
          <li style="display: flex; flex-direction: column; gap: 8px"><span style="height: 4px; background: #D4D4D3"></span><span style="font-size: 14px; color: #5F5F5E">4 · Review</span></li>
        </ol>
      </div>
    </section>

    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px; padding-top: 36px; padding-bottom: 64px">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">

        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 20px; background: #FEE8CD">
          <span><strong>You have an unfinished draft</strong> for Amazon 2025, Online assessment, saved 10 minutes ago.</span>
          <a href="S3a-Submit-type-questions.html" style="font-weight: 700">Continue the draft</a>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; position: relative">
          <label for="co" class="lbl">Company</label>
          <input id="co" class="field" type="text" value="Amaz" role="combobox" aria-expanded="true" aria-controls="co-list" aria-autocomplete="list">
          <ul id="co-list" role="listbox" style="list-style: none; margin: 0; padding: 0; border: 1px solid #2B2B2B; border-top: none; background: #FFFFFF; box-shadow: 0 1px 4px rgb(43 43 43 / 30%)">
            <li role="option" aria-selected="true" style="padding: 12px 14px; background: #F7F7F7; display: flex; justify-content: space-between"><strong>Amazon</strong><span class="hint">2 open drives</span></li>
            <li role="option" aria-selected="false" style="padding: 12px 14px; display: flex; justify-content: space-between; border-top: 1px solid #E3E3E3"><span>Amazon Web Services</span><span class="hint">No open drive</span></li>
          </ul>
        </div>

        <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
          <legend class="lbl" style="margin-bottom: 10px">Open drives for Amazon</legend>
          <template data-sc-for list="{{drives}}" as="d" hint-placeholder-count="2">
            <label class="opt" style="{{d.style}}">
              <input type="radio" name="drive" checked="{{d.on}}" onChange="{{d.pick}}">
              <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 17px">{{d.title}}</strong><span class="hint">{{d.sub}}</span></span>
              <span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #23683A">Open</span>
            </label>
          </template>
        </fieldset>

        <div style="border-top: 1px solid #E3E3E3; padding-top: 20px; display: flex; flex-direction: column; gap: 14px">
          <button type="button" aria-expanded="{{reqOpen}}" onClick="{{toggleReq}}" style="align-self: flex-start; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: none; background: none; font: inherit; font-weight: 700; color: #CD1739; cursor: pointer">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M5 12h14"/><path d="{{reqBar}}"/></svg>
            My drive is not listed
          </button>
          <template data-sc-if value="{{showReq}}" hint-placeholder-val="{{ false }}">
            <div style="background: #F7F7F7; padding: 24px; display: flex; flex-direction: column; gap: 16px">
              <p style="margin: 0; font-size: 15px">Tell the CDC about it. You can keep going with a draft; it moves on once the drive is added.</p>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
                <div style="display: flex; flex-direction: column; gap: 6px"><label for="rq-co" class="lbl">Company</label><input id="rq-co" class="field" type="text"></div>
                <div style="display: flex; flex-direction: column; gap: 6px"><label for="rq-role" class="lbl">Role</label><input id="rq-role" class="field" type="text"></div>
                <div style="display: flex; flex-direction: column; gap: 6px"><label for="rq-date" class="lbl">Test date</label><input id="rq-date" class="field" type="date"></div>
              </div>
              <button type="button" class="btn2" style="align-self: flex-start">Send request and continue</button>
            </div>
          </template>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-top: 2px solid #2B2B2B; padding-top: 20px">
          <a class="btn2" href="02-Home.html">Cancel</a>
          <span class="hint" style="flex: 1 1 auto; text-align: right">Your progress saves as you go</span>
          <a class="btn" href="S2-Submit-round-details.html">Continue to round details</a>
        </div>
      </div>

      <aside style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 28px">
        <section style="border-top: 4px solid #2B2B2B; background: #F7F7F7; padding: 24px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 700">How submitting works</h2>
          <ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
            <li>Choose the drive and round.</li>
            <li>Type the questions or upload photos of your sheet.</li>
            <li>Check our cleaned-up version and submit.</li>
            <li>The CDC reviews it; you will see it in My submissions.</li>
          </ol>
          <a href="00b-Submission-workflow.html" style="font-weight: 700; font-size: 15px">See the full workflow</a>
        </section>
        <section style="display: flex; flex-direction: column; gap: 10px; font-size: 15px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #CD1739">Before you start</h2>
          <p style="margin: 0">Only share a test you sat yourself, and only after its window has closed. You stay anonymous unless you choose credit. <a href="13-Help-and-FAQ.html" style="font-weight: 700">Read the honour code</a>.</p>
        </section>
      </aside>
    </div>
  </main>

  <footer class="ftr">
    <div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; padding-top: 44px; padding-bottom: 36px">
      <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 12px">
        <span style="color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase">Career Development Centre</span>
        <span style="font-size: 14px; font-weight: 300; line-height: 1.7">Shiv Nadar Institution of Eminence, Delhi NCR. Questions are shared by students who sat the test and checked by the CDC. For SNU students only.</span>
      </div>
      <nav aria-label="Footer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 48px; font-size: 14px; font-weight: 500">
        <a href="03-Companies.html">Companies</a><a href="13-Help-and-FAQ.html">Help and FAQ</a><a href="S1-Submit-choose-drive.html">Submit an OA</a><a href="13-Help-and-FAQ.html">Honour code</a><a href="10-My-submissions.html">My submissions</a><a href="13-Help-and-FAQ.html">Contact the CDC</a>
      </nav>
    </div>
    <div style="border-top: 1px solid rgb(255 255 255 / 40%)"><div class="wrap" style="padding-top: 14px; padding-bottom: 14px; font-size: 13px">© Career Development Centre, Shiv Nadar IoE</div></div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { drive: 0, req: false }; }
  renderVals() {
    const list = [
      { title: '2025 · SDE intern', sub: 'Online assessment held 14 August · 9 students have shared so far' },
      { title: '2025 · SDE I, full time', sub: 'Online assessment held 2 September · 3 students have shared so far' }
    ];
    const drives = list.map((d, i) => {
      const on = this.state.drive === i;
      return { ...d, on, style: on ? 'border: 2px solid #CD1739; padding: 17px' : '', pick: () => this.setState({ drive: i }) };
    });
    const r = this.state.req;
    return { drives, showReq: r, reqOpen: r ? 'true' : 'false', reqBar: r ? 'M12 12v0' : 'M12 5v14', toggleReq: () => this.setState({ req: !r }) };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>14 · Not found, access denied · CDC Student Portal</title>
<script src="support.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#CD1739}a:hover{color:#A51230}
:focus-visible{outline:2px solid #2B2B2B;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.top{background:#2B2B2B;color:#F4E6CD;font-size:13px}
.top a{color:#F4E6CD;text-decoration:none}.top a:hover{color:#FFFFFF;text-decoration:underline}
.hdr{background:#FFFFFF;border-bottom:1px solid #E3E3E3}
.nav a{color:#2B2B2B;text-decoration:none;font-weight:700;font-size:15px;padding:24px 0 22px;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:#CD1739;border-bottom-color:#CD1739}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;background:#CD1739;color:#FFFFFF;border:1px solid #CD1739;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#A51230;border-color:#A51230;color:#FFFFFF}
.btn[aria-disabled="true"]{background:#D4D4D3;border-color:#D4D4D3;color:#4A4A49;cursor:not-allowed;pointer-events:none}
.nav a.btn{padding:0 22px;min-height:46px;border-bottom:1px solid #CD1739;color:#FFFFFF}
.nav a.btn[aria-current="page"]{background:#A51230;border-color:#A51230}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;background:transparent;color:#2B2B2B;border:1px solid #2B2B2B;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn2:hover{background:#2B2B2B;color:#FFFFFF}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#CD1739}
.field{width:100%;min-height:44px;padding:0 12px;border:1px solid #8C8C8B;background:#FFFFFF;font:inherit;font-size:15px;color:#2B2B2B;border-radius:0}
.field:focus{border-color:#2B2B2B;outline:none;box-shadow:0 0 0 1px #2B2B2B}
textarea.field{padding:12px 14px;resize:vertical;line-height:1.65;font-family:'JetBrains Mono',monospace;font-size:13px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F5F5E}
.hint{font-size:14px;color:#5F5F5E}
.orig{padding:12px 14px;background:#F7F7F7;border:1px solid #E3E3E3;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.65;white-space:pre-wrap;min-height:170px;color:#3A3A39}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:#CD1739;flex:none}
.ftr{background:#2B2B2B;color:#F4E6CD}
.ftr a{color:#FFFFFF;text-decoration:none}.ftr a:hover{text-decoration:underline}
.tag{display:inline-block;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.t-draft{border:1px solid #8C8C8B;color:#4A4A49}
.t-proc{background:#2B2B2B;color:#FFFFFF}
.t-pend{background:#FEE8CD;color:#7A4100}
.t-pub{background:#E3F1E7;color:#23683A}
.t-not{background:#EFEFEF;color:#4A4A49}
.tab{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;margin-right:24px;background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:700;font-size:15px;color:#4A4A49;cursor:pointer;text-decoration:none}
.tab:hover{color:#CD1739}
.tab[aria-selected="true"]{color:#CD1739;border-bottom-color:#CD1739}
.crumb{font-size:14px;color:#5F5F5E}.crumb a{color:#2B2B2B}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F5F5E;padding:10px 12px;border-bottom:2px solid #2B2B2B}
table.list td{padding:16px 12px;border-bottom:1px solid #E3E3E3;vertical-align:top}
table.list tr:hover td{background:#FAFAFA}
</style>
</helmet>
<div style="font-family: 'DM Sans', sans-serif; color: #2B2B2B; background: #FFFFFF; min-height: 100vh; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column">

  <div class="top"><div class="wrap" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; padding-top: 8px; padding-bottom: 8px"><span>Career Development Centre · Shiv Nadar Institution of Eminence</span><span style="display: flex; gap: 20px"><a href="13-Help-and-FAQ.html">Help</a><a href="10-My-submissions.html">Notifications (1)</a><a href="12-Profile.html">Aarav Sharma</a></span></div></div>
  <header class="hdr"><div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 32px">
    <a href="02-Home.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; text-decoration: none; color: #2B2B2B">
      <span style="display: flex; flex-direction: column; line-height: 1.05; text-transform: uppercase; font-weight: 700; font-size: 17px; letter-spacing: .04em">Shiv Nadar<span style="font-size: 10px; font-weight: 500; letter-spacing: .26em; margin-top: 3px">University</span></span>
      <span aria-hidden="true" style="width: 2px; height: 44px; background: #FFA700"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 700; font-size: 16px">Placement Question Bank</span><span style="font-size: 13px; color: #5F5F5E">Career Development Centre</span></span>
    </a>
    <nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px">
      <a href="03-Companies.html">Companies</a>
      <a href="08-Topics.html">Topics</a>
      <a href="07-Search.html">Search</a>
      <a href="11-Bookmarks.html">Bookmarks</a>
      <a href="10-My-submissions.html">My submissions</a>
      <a class="btn" href="S1-Submit-choose-drive.html">Submit OA</a>
    </nav>
  </div></header>

  <main style="flex: 1 1 auto; display: flex">
    <div class="wrap" style="flex: 1 1 auto; padding-top: 80px; padding-bottom: 96px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 56px; align-items: start">
      <div style="border-top: 4px solid #CD1739; padding-top: 18px">
        <span style="font-size: 120px; line-height: 1; font-weight: 700; letter-spacing: -.02em; color: #2B2B2B">{{code}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px; max-width: 600px">
        <p class="eyebrow">{{eyebrow}}</p>
        <h1 style="margin: 0; font-size: 38px; line-height: 1.15; font-weight: 700">{{title}}</h1>
        <p style="margin: 0; font-size: 17px; color: #4A4A49">{{body}}</p>
        <template data-sc-if value="{{isDenied}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 14px 18px; background: #F7F7F7; border-left: 3px solid #2B2B2B; font-size: 15px">You are signed in as <strong>aarav.sharma@outlook.com</strong>.</p>
        </template>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
          <a class="btn" href="{{primaryHref}}">{{primary}}</a>
          <a class="btn2" href="13-Help-and-FAQ.html">Get help</a>
        </div>
        <template data-sc-if value="{{isMissing}}" hint-placeholder-val="{{ true }}">
          <div style="margin-top: 24px; border-top: 1px solid #E3E3E3; padding-top: 18px; display: flex; flex-direction: column; gap: 8px">
            <span class="lbl">Or go to</span>
            <span style="display: flex; flex-wrap: wrap; gap: 8px 24px; font-weight: 700"><a href="03-Companies.html">Companies</a><a href="07-Search.html">Search</a><a href="10-My-submissions.html">My submissions</a></span>
          </div>
        </template>
      </div>
    </div>
  </main>

  <footer class="ftr">
    <div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; padding-top: 44px; padding-bottom: 36px">
      <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 12px">
        <span style="color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase">Career Development Centre</span>
        <span style="font-size: 14px; font-weight: 300; line-height: 1.7">Shiv Nadar Institution of Eminence, Delhi NCR. Questions are shared by students who sat the test and checked by the CDC. For SNU students only.</span>
      </div>
      <nav aria-label="Footer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 48px; font-size: 14px; font-weight: 500">
        <a href="03-Companies.html">Companies</a><a href="13-Help-and-FAQ.html">Help and FAQ</a><a href="S1-Submit-choose-drive.html">Submit an OA</a><a href="13-Help-and-FAQ.html">Honour code</a><a href="10-My-submissions.html">My submissions</a><a href="13-Help-and-FAQ.html">Contact the CDC</a>
      </nav>
    </div>
    <div style="border-top: 1px solid rgb(255 255 255 / 40%)"><div class="wrap" style="padding-top: 14px; padding-bottom: 14px; font-size: 13px">© Career Development Centre, Shiv Nadar IoE</div></div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"page":{"editor":"enum","options":["Not found","Access denied"],"default":"Not found"},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const denied = (this.props.page ?? 'Not found') === 'Access denied';
    return denied ? {
      isDenied: true, isMissing: false, code: '403', eyebrow: 'Access denied',
      title: 'This site is for Shiv Nadar students only',
      body: 'Sign in again with your SNU Microsoft account, the one ending in snu.edu.in.',
      primary: 'Sign in with your SNU account', primaryHref: '01-Sign-in.html'
    } : {
      isDenied: false, isMissing: true, code: '404', eyebrow: 'Page not found',
      title: 'We could not find that page',
      body: 'The link may be old, or the question may have been moved to another round. Try searching for it instead.',
      primary: 'Search questions', primaryHref: '07-Search.html'
    };
  }
}

</script>
</body>
</html>
